<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Žvėris Kareivis</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--panel:#111922;--line:#263746;--text:#edf5f7;--muted:#92a7b2;--green:#55e59a;--red:#ff7070;--accent:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#152631,var(--bg) 45%);color:var(--text);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
main{max-width:980px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}h1{font-size:25px;margin:0}h1 span{color:var(--accent)}#status{font-size:13px;color:var(--muted);text-align:right}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px}.bad .dot{background:var(--red)}
#chat{height:calc(100vh - 235px);min-height:300px;overflow-y:auto;padding:22px 4px}.msg{max-width:86%;margin:12px 0;padding:13px 16px;border:1px solid var(--line);border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-left:auto;background:#17372f;border-color:#28644f}.assistant{background:var(--panel)}.meta{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.empty{text-align:center;color:var(--muted);margin-top:60px}
form{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}textarea{flex:1;resize:none;min-height:54px;max-height:180px;background:#0b1219;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}button{border:0;border-radius:10px;background:var(--accent);color:#191006;font:700 15px system-ui;padding:14px 22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}@media(max-width:600px){main{padding:12px}#chat{height:calc(100vh - 225px)}.msg{max-width:96%}button{padding:12px 15px}}
</style>
</head>
<body><main>
<header><h1>ŽVĖRIS <span>KAREIVIS</span></h1><div id="status"><span class="dot"></span><span id="statusText">Jungiamasi…</span></div></header>
<section id="chat" aria-live="polite"><div class="empty" id="empty">Rašyk žinutę. Enter — siųsti, Shift+Enter — nauja eilutė.</div></section>
<form id="form"><textarea id="input" rows="2" placeholder="Žinutė Žvėriui…" aria-label="Žinutė" required></textarea><button id="send" type="submit">Siųsti</button></form>
<footer>Vietinis servisas · 127.0.0.1:8091 · atmintis išsaugoma serveryje</footer>
</main>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),statusBox=document.getElementById('status'),statusText=document.getElementById('statusText');
let history=[],busy=false;
function addMessage(role,text){const empty=document.getElementById('empty');if(empty)empty.remove();const box=document.createElement('div');box.className='msg '+(role==='user'?'user':'assistant');const meta=document.createElement('div');meta.className='meta';meta.textContent=role==='user'?'TU':'ŽVĖRIS';const body=document.createElement('div');body.textContent=text||'(tuščias atsakymas)';box.append(meta,body);chat.appendChild(box);chat.scrollTop=chat.scrollHeight;return body}
async function refreshStatus(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();statusBox.classList.toggle('bad',!s.ok);statusText.textContent=(s.ok?'Veikia':'Klaida')+' · '+(s.model||'modelis nenurodytas')+' · modelių: '+(s.models||[]).length}catch(e){statusBox.classList.add('bad');statusText.textContent='API neveikia: '+e.message}}
async function loadHistory(){try{const r=await fetch('/api/memory/chat',{cache:'no-store'});if(!r.ok)return;const data=await r.json();history=(data.messages||[]).slice(-30);for(const m of history)addMessage(m.role,m.content||'')}catch(e){}}
async function sendMessage(event){event.preventDefault();if(busy)return;const message=input.value.trim();if(!message)return;busy=true;send.disabled=true;addMessage('user',message);input.value='';const pending=addMessage('assistant','Dirbu…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(-20),files:[]})});const data=await r.json();if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));const reply=data.reply||'(tuščias atsakymas)';pending.textContent=reply;history.push({role:'user',content:message},{role:'assistant',content:reply});history=history.slice(-30)}catch(e){pending.textContent='KLAIDA: '+e.message}finally{busy=false;send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}}
form.addEventListener('submit',sendMessage);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});refreshStatus();loadHistory();setInterval(refreshStatus,15000);input.focus();
</script></body></html>
